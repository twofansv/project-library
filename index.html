<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Library</title>
    <script src="/script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Your Library</h1>
        <button class="button open-button">open modal</button>

        <dialog class="modal" id="modal">
            <label for="title"> Title
                <input type="text" name="title" class="inp-title">
            </label>

            <label for="author"> Author
                <input type="text" name="author" class="inp-author">
            </label>

            <label for="pages"> Pages
                <input type="number" name="pages" class="inp-pages">
            </label>

            <label for="read"> Already Read?
                <input type="checkbox" name="read" class="inp-read">
            </label>
            
            <button class="button close-button">close modal</button>
            <button class="button add-book">Add Book</button>

        </dialog>
        
    </header>

    <main>
        <div class="cards-box">
            <div class="cards">
                <h2>Book Title</h2>
                <p>Description of the book lorem ipsum</p>
                <p>256 pages</p>
                <button>Read</button>
            </div>
        </div>
    </main>

    <footer>
        <p>@twofansv, a project for The Odin Project</p>
    </footer>
    
</body>

</html>
