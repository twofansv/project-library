<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="nav-container">
            <h1 id="your-library">Your Library</h1>
            <button class="button open-button"> + Add Book</button>
        </div>

        <dialog class="modal" id="modal">
            <form class="form" action="#" method="get">
                <label for="title"> Title: </label>
                    <input type="text" name="title" class="inp-title" required>
                

                <label for="author"> Author: </label> 
                    <input type="text" name="author" class="inp-author" required>
                

                <label for="pages"> Pages: </label>
                    <input type="number" name="pages" class="inp-pages" required>
                
    
                <label for="read"> Already Read? 
                    <input type="checkbox" name="read" class="inp-read"> 
                </label>
                
                <button class="button close-button" type="button">Cancel</button>
                <button class="button add-book">Add Book</button>
            </form>
        </dialog>
        
    </header>

    <main>
        <div class="cards-box">
            <!-- rendered cards -->
             
        </div>
        
    
    </main>

    <footer>
        <p>@twofansv, a project for The Odin Project</p>
    </footer>
    
</body>

</html>
